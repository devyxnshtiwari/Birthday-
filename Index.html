<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #fff0f5 0%, #fde2e4 100%);
      color: #333;
      text-align: center;
      min-height: 100vh;
    }
    .hero h1 {
      font-size: 2rem;
      color: #d81b60;
      margin: 10px 0;
    }
    .card {
      background: white;
      padding: 12px 12px 25px 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-radius: 8px;
      margin: 20px auto;
      max-width: 280px;
    }
    .card img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }
    .caption {
      font-style: italic;
      margin-top: 12px;
      color: #666;
    }
    button {
      background: #ff4081;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      margin: 15px 0;
      box-shadow: 0 4px 12px rgba(255,64,129,0.3);
    }
    .letter {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 300px;
      margin: 15px auto;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>

  <div class="hero">
    <p>A tiny website made with love</p>
    <h1>Happy Birthday! 💖</h1>
  </div>

  <div class="card">
    <!-- Yahan photo ka link aayega -->
    <img id="myPhoto" src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=500" alt="Memory">
    <p class="caption">My favourite smile ✨</p>
  </div>

  <div>
    <button onclick="toggleLetter()">Open Secret Letter 💌</button>
    <div id="letterBox" class="letter">
      <p>Wishing you the happiest birthday! May all your dreams come true. You are truly special! 🌸✨</p>
    </div>
  </div>

  <div>
    <button onclick="magic()">Send Birthday Magic ✨</button>
  </div>

  <script>
    function toggleLetter() {
      var box = document.getElementById("letterBox");
      box.style.display = (box.style.display === "block") ? "none" : "block";
    }
    function magic() {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
  </script>
</body>
</html>
